[project]
name = "hermes-toolkit-mcp"
version = "0.1.0"
description = "Safety-first MCP operations cockpit for Hermes Agent installations"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Janusz (rzyns)" },
]
keywords = ["hermes-agent", "mcp", "operations", "safety"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28,<1.0",
    "mcp>=1.9.0,<2.0.0",
    "pydantic>=2.7,<3.0",
    "pyyaml>=6.0,<7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<9.0",
]

[project.scripts]
hermes-toolkit-mcp = "hermes_toolkit_mcp.cli:main"

[project.urls]
Repository = "https://github.com/hermegeddon/hermes-toolkit-mcp"
Issues = "https://github.com/hermegeddon/hermes-toolkit-mcp/issues"
Security = "https://github.com/hermegeddon/hermes-toolkit-mcp/security"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hermes_toolkit_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
