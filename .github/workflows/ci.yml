name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Sync locked environment
        run: uv sync --all-extras --locked
      - name: Run tests
        run: uv run pytest -q
      - name: Validate configuration surface
        run: uv run hermes-toolkit-mcp --config examples/read-only.yaml config-check --json
